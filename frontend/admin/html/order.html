<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f9fafb;}
    h1 { text-align:center; }
    table { width:100%; border-collapse: collapse; margin-top:20px;}
    th, td { border:1px solid #ddd; padding:8px; text-align:center;}
    th { background:#1f2937; color:white;}
    button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer; }
    .delete-btn { background:#dc2626; color:white;}
    .restore-btn { background:#10b981; color:white;}
    .status-btn { background:#3b82f6; color:white;}
    .status-btn:hover, .delete-btn:hover, .restore-btn:hover { opacity:0.8;}
  </style>
</head>
<body>
  <h1>Đơn hàng</h1>
  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Người đặt</th>
        <th>Sản phẩm</th>
        <th>Tổng tiền</th>
        <th>Trạng thái</th>
        <th>Ngày đặt</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="orderTable"></tbody>
  </table>

  <script type="module" src="../js/order.js"></script>
</body>
</html>
