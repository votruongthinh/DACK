<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <title>Admin Dashboard</title>

  </head>
  <body>
    <header>
      <h1>Admin Dashboard</h1>
      <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
    </header>

    <nav>
      <a href="./product.html">📦 Sản phẩm</a>
      <a href="./category.html">📂 Danh mục</a>
      <a href="./order.html">🧾 Đơn hàng</a>
      <a href="./review.html">⭐ Đánh giá</a>
    </nav>

    <main>
      <h2>Chào mừng bạn đến trang quản trị 👋</h2>
      <p>Chọn mục trong menubar để quản lý dữ liệu.</p>
    </main>

    <script type="module">
      import { checkAdminaccess } from "../js/authGuard.js";
      checkAdminaccess();

      // 🟢 Nút đăng xuất
      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        alert("Đã đăng xuất!");
        window.location.href = "/frontend/user/html/login.html";
      });
    </script>
  </body>
</html>
