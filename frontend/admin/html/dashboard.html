<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        background-color: #f9fafb;
      }

      header {
        background-color: #111827;
        color: white;
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header h1 {
        font-size: 20px;
        margin: 0;
      }

      nav {
        background-color: #1f2937;
        display: flex;
        gap: 16px;
        padding: 12px 20px;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 8px 14px;
        border-radius: 6px;
        transition: background 0.3s;
      }

      nav a:hover {
        background-color: #2563eb;
      }

      .logout-btn {
        background: #dc2626;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
      }

      .logout-btn:hover {
        background: #b91c1c;
      }

      main {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Admin Dashboard</h1>
      <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
    </header>

    <nav>
      <a href="./product.html">📦 Sản phẩm</a>
      <a href="./category.html">📂 Danh mục</a>
      <a href="./order.html">🧾 Đơn hàng</a>
      <a href="./review.html">⭐ Đánh giá</a>
    </nav>

    <main>
      <h2>Chào mừng bạn đến trang quản trị 👋</h2>
      <p>Chọn mục trong menubar để quản lý dữ liệu.</p>
    </main>

    <script type="module">
      import { checkAdminaccess } from "../js/authGuard.js";
      checkAdminaccess();

      // 🟢 Nút đăng xuất
      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        alert("Đã đăng xuất!");
        window.location.href = "/frontend/user/html/login.html";
      });
    </script>
  </body>
</html>
